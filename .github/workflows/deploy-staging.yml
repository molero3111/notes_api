# Deploy notes_api to staging VPS when code is merged into the staging branch.
# - Builds and pushes the Docker image to Docker Hub (CI does the build; VPS stays light).
# - SSHs into the VPS and runs: checkout staging, git pull, docker compose pull, up -d
#
# Secrets: use the "notes env" environment (Settings → Environments → notes env) or add as Repository secrets.
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, SSH_PRIVATE_KEY

name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  DOCKER_IMAGE: molero3111/notes-api:latest

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: notes env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::DOCKERHUB_USERNAME is not set. Add it in Settings → Secrets and variables → Actions (exact name, case-sensitive)."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set. Add it in Settings → Secrets and variables → Actions (exact name, case-sensitive)."
            exit 1
          fi
          echo "Docker Hub secrets are set."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: notes env
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/notes_crud/backend
            git fetch origin
            git checkout staging
            git pull origin staging
            docker compose -f docker-compose-staging.yml pull
            docker compose -f docker-compose-staging.yml up -d
