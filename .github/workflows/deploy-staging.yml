# Deploy notes_api to staging VPS when code is merged into the staging branch.
# - Builds and pushes the Docker image to Docker Hub (CI does the build; VPS stays light).
# - SSHs into the VPS and runs: git pull && docker compose pull && docker compose up -d
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   - Docker Hub username
#   DOCKERHUB_TOKEN      - Docker Hub access token (Settings → Security → Access tokens)
#   VPS_HOST             - VPS hostname or IP
#   VPS_USER             - SSH user (e.g. ubuntu, root)
#   SSH_PRIVATE_KEY      - Full private key content for SSH (public key in VPS ~/.ssh/authorized_keys)

name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  DOCKER_IMAGE: molero3111/notes-api:latest

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/notes_crud/backend
            git pull
            docker compose -f docker-compose-staging.yml pull
            docker compose -f docker-compose-staging.yml up -d
