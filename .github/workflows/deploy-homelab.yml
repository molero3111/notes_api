# Deploy notes_api to the homelab when code is merged into the staging branch (or on demand).
# - Builds and pushes the image to GHCR as ghcr.io/molero3111/notes-api:<sha> and :homelab.
# - Joins the tailnet and SSHes to the deploy user, whose forced command takes "<app> <tag>"
#   and pulls, runs up -d and health-checks on the server.
#
# Runs alongside deploy-staging.yml (DigitalOcean / Docker Hub), which it does not touch.
# Secrets: "homelab" environment.
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, HOMELAB_SSH_KEY, HOMELAB_KNOWN_HOSTS

name: Deploy to Homelab

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/molero3111/notes-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:homelab
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy on homelab
    runs-on: ubuntu-latest
    needs: build
    # Manual runs from other branches build the image but only staging is deployed
    if: github.ref == 'refs/heads/staging'
    environment: homelab
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          HOMELAB_SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          HOMELAB_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOMELAB_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOMELAB_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@100.77.124.5 "notes-api ${{ github.sha }}"
